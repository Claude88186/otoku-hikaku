<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>お得比較</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><section data-view="compare" aria-label="商品比較"><header><h1>お得比較</h1><button id="clear-all">全部クリア</button></header><nav id="units" aria-label="比較する単位"></nav><div id="cards"></div><p id="storage-note" role="status"></p></section><!-- 第2段階: この位置に画面切り替え用のタブバーを追加 --></main>
<aside id="keypad" aria-label="電卓" hidden><div class="calculator-head"><strong id="editing-label"></strong><button data-action="close">閉じる</button></div><div id="expression" aria-live="polite"></div><div id="preview" role="status"></div><div class="discounts"><button data-factor="0.9">−10%</button><button data-factor="0.8">−20%</button><button data-factor="0.7">−30%</button><button data-factor="0.5">半額</button><button data-factor="1.08">×1.08</button></div><div class="keys"><button data-action="clear">C</button><button data-key="(">(</button><button data-key=")">)</button><button data-action="back" aria-label="1文字削除">⌫</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="÷">÷</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="×">×</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="−">−</button><button data-key="0">0</button><button data-key="00">00</button><button data-key=".">.</button><button data-key="+">+</button><button data-key="%">%</button><button data-action="equal">=</button><button data-action="next">次へ</button><button data-action="confirm" class="primary">確定</button></div></aside><div id="toast" role="status" hidden>クリアしました <button id="undo">元に戻す</button></div></body></html>
